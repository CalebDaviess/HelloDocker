include:
  - path: ./infra.yaml

services:
  web:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_JDBC_URL: ${DB_JDBC_URL:-jdbc:postgresql://postgres:5432/product_catalog}
      DB_USERNAME: ${DB_USERNAME:-product_catalog}
      DB_PASSWORD: ${DB_PASSWORD:-product_catalog}
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: src/main
        - action: rebuild
          path: pom.xml
