name: hellodocker-deploy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DEPLOY_DB_NAME:?Set DEPLOY_DB_NAME in .env.deploy}
      POSTGRES_USER: ${DEPLOY_DB_USERNAME:?Set DEPLOY_DB_USERNAME in .env.deploy}
      POSTGRES_PASSWORD: ${DEPLOY_DB_PASSWORD:?Set DEPLOY_DB_PASSWORD in .env.deploy}
    volumes:
      - deployment-product-catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    image: ${PRODUCT_CATALOG_IMAGE:?Set PRODUCT_CATALOG_IMAGE in .env.deploy}
    environment:
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/${DEPLOY_DB_NAME:?Set DEPLOY_DB_NAME in .env.deploy}
      DB_USERNAME: ${DEPLOY_DB_USERNAME:?Set DEPLOY_DB_USERNAME in .env.deploy}
      DB_PASSWORD: ${DEPLOY_DB_PASSWORD:?Set DEPLOY_DB_PASSWORD in .env.deploy}
    depends_on:
      postgres:
        condition: service_healthy

  public-gateway:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${DEPLOY_PUBLIC_PORT:-8083}:80"
    volumes:
      - ./nginx.public.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ./.secrets/catalog.htpasswd
        target: /etc/nginx/.htpasswd
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - web
    networks:
      - default
      - ci

networks:
  ci:
    name: devops-ci
    external: true

volumes:
  deployment-product-catalog-data:
