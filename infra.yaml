services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: product_catalog
      POSTGRES_USER: ${DB_USERNAME:-product_catalog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-product_catalog}
    volumes:
      - product-catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-product_catalog} -d product_catalog"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  product-catalog-data:
