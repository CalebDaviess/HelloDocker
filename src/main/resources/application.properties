quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:product_catalog}
quarkus.datasource.password=${DB_PASSWORD:product_catalog}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:${DB_URL:jdbc:postgresql://localhost:5432/product_catalog}}

%dev.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/product_catalog}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/product_catalog}
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:product_catalog;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=update
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.datasource.devservices.enabled=false
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Product Catalog API
quarkus.smallrye-openapi.info-version=1.0.0
